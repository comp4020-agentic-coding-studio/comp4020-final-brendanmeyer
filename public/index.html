<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collective Snake</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1021; color: #e5e7eb; font-family: sans-serif; }
      main { display: flex; flex-direction: column; height: 100%; }
      header { padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline; }
      header a { color: #93c5fd; }
      #fullscreen, #request-join, #accept-offer, #decline-offer, #set-password-btn, #change-user-btn { background: none; border: 1px solid #374151; color: #e5e7eb; border-radius: 4px; padding: 0.15rem 0.5rem; font: inherit; cursor: pointer; }
      #game { flex: 1; width: 100%; display: block; touch-action: none; }
      #last-run { padding: 0 1rem 0.75rem; font-size: 0.9rem; color: #9ca3af; }
      #entry { position: fixed; inset: 0; background: #0b1021; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
      #entry[hidden] { display: none; }
      #entry input { font: inherit; padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid #374151; background: #111827; color: #e5e7eb; }
      #swatches { display: grid; grid-template-columns: repeat(8, 2rem); gap: 0.4rem; max-width: 20rem; }
      #swatches button { width: 2rem; height: 2rem; border-radius: 50%; border: 1px solid #374151; cursor: pointer; padding: 0; }
      #play { font: inherit; padding: 0.5rem 1.5rem; border-radius: 4px; border: none; background: #6ee7b7; color: #0b1021; cursor: pointer; }
      #queue-status { padding: 0 1rem; font-size: 0.9rem; color: #9ca3af; }
      .dialog-overlay { position: fixed; inset: 0; background: rgba(11, 16, 33, 0.75); display: flex; align-items: center; justify-content: center; }
      .dialog-overlay[hidden] { display: none; }
      .dialog-box { background: #111827; border: 1px solid #374151; border-radius: 8px; padding: 1.25rem 1.5rem; max-width: 22rem; display: flex; flex-direction: column; gap: 1rem; }
      .dialog-buttons { display: flex; justify-content: flex-end; gap: 0.5rem; }
      .dialog-buttons button { font: inherit; padding: 0.4rem 1rem; border-radius: 4px; border: 1px solid #374151; background: none; color: #e5e7eb; cursor: pointer; }
      #dialog-confirm, #password-dialog-confirm { background: #6ee7b7; color: #0b1021; border: none; }
      #password-dialog input { font: inherit; padding: 0.4rem 0.6rem; border-radius: 4px; border: 1px solid #374151; background: #111827; color: #e5e7eb; }
      #password-dialog-error { color: #fca5a5; font-size: 0.85rem; margin: 0; min-height: 1.1em; }
    </style>
  </head>
  <body>
    <div id="entry">
      <strong>Collective Snake</strong>
      <input id="name-input" type="text" placeholder="Pick a name (optional)" maxlength="22" />
      <input id="password-input" type="password" placeholder="Password (optional -- protects your name on other devices)" />
      <div id="swatches"></div>
      <button id="play" type="button">Play</button>
    </div>
    <div id="dialog" class="dialog-overlay" hidden>
      <div class="dialog-box">
        <p id="dialog-message"></p>
        <div class="dialog-buttons">
          <button id="dialog-cancel" type="button">No thanks</button>
          <button id="dialog-confirm" type="button">OK</button>
        </div>
      </div>
    </div>
    <div id="password-dialog" class="dialog-overlay" hidden>
      <div class="dialog-box">
        <p>Set a password for this name. With one set, you can reclaim it on another device by entering it.</p>
        <input id="password-dialog-input" type="password" placeholder="New password" maxlength="100" />
        <p id="password-dialog-error"></p>
        <div class="dialog-buttons">
          <button id="password-dialog-cancel" type="button">Cancel</button>
          <button id="password-dialog-confirm" type="button">Set password</button>
        </div>
      </div>
    </div>
    <main>
      <header>
        <strong>Collective Snake</strong>
        <span id="status">Connecting…</span>
        <span id="score"></span>
        <a href="/readme/">What this is</a>
        <a href="/stats.html">Stats</a>
        <button id="set-password-btn" type="button" hidden>Set password</button>
        <button id="change-user-btn" type="button" hidden>Change user</button>
        <button id="fullscreen" type="button" hidden>Fullscreen</button>
      </header>
      <div id="queue-status">
        <button id="request-join" type="button" hidden>Join when a slot opens</button>
        <button id="accept-offer" type="button" hidden>Take the open slot</button>
        <button id="decline-offer" type="button" hidden>No thanks</button>
      </div>
      <canvas id="game"></canvas>
      <div id="last-run"></div>
    </main>
    <script type="module" src="/client/main.js"></script>
  </body>
</html>
