<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collective Snake — Stats</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0b1021; color: #e5e7eb; font-family: sans-serif; }
      main { max-width: 40rem; margin: 0 auto; padding: 1rem; }
      header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: baseline; margin-bottom: 1rem; }
      header a { color: #93c5fd; }
      h2 { font-size: 1rem; color: #9ca3af; margin-top: 2rem; }
      dl { display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; }
      dt { color: #9ca3af; }
      dd { margin: 0; text-align: right; }
      table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
      th, td { text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid #1f2937; }
      th { color: #9ca3af; font-weight: normal; }
      tbody tr { cursor: pointer; }
      tbody tr:hover { background: #111827; }
      #replay { width: 100%; max-width: 30rem; aspect-ratio: 1; display: none; background: #0b1021; border: 1px solid #1f2937; margin-top: 0.5rem; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <strong>Collective Snake</strong>
        <a href="/">Play</a>
        <a href="/readme/">What this is</a>
      </header>
      <h2>Global stats</h2>
      <dl id="stats"></dl>
      <h2>Record runs</h2>
      <p style="color: #9ca3af; font-size: 0.85rem;">Click a run to replay it.</p>
      <canvas id="replay"></canvas>
      <table>
        <thead>
          <tr><th>Collective score</th><th>Raw score</th><th>Peak players</th><th>When</th></tr>
        </thead>
        <tbody id="records"></tbody>
      </table>
    </main>
    <script type="module" src="/client/stats.js"></script>
  </body>
</html>
